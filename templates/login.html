{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div style="width:400px;margin:120px auto;">

<h2>User Login</h2>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
placeholder="Username"
required>

<br><br>

<input
type="password"
name="password"
placeholder="Password"
required>

<br><br>

<button type="submit">

Login

</button>

</form>

</div>

{% endblock %}
